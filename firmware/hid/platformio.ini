; OAT probe for XCSoar - Seeed XIAO RP2040 + Adafruit MAX31865 (ADA3648) PT1000
;
; Flash: pio run -d firmware/hid -t upload (from repo root)
; No serial port: read reports with tools/read_oat_hid.py

[env:seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200

; Vendor HID (not CDC serial). Earle Philhower reads these board keys, not -DUSB_PID.
; See ../../docs/hid-xcsoar.md.
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
board_build.arduino.earlephilhower.usb_pid = 0x0A01
board_build.arduino.earlephilhower.usb_manufacturer = OAT
board_build.arduino.earlephilhower.usb_product = PT1000 OAT

build_flags =
  -DDISABLE_USB_SERIAL

lib_deps =
  adafruit/Adafruit MAX31865 library @ ^1.6.2
