; OAT probe for XCSoar - Seeed XIAO RP2040 + Adafruit MAX31865 (ADA3648) PT1000
;
; Flash later: pio run -t upload
; Serial monitor: pio device monitor -b 115200

[env:seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200

; Vendor HID (not CDC serial). New PID so Android does not treat this as Pico serial.
; XCSoar stock OpenVario will not see this; use the HID driver in a fork.
; See docs/hid-xcsoar.md.
build_flags =
  -DUSB_VID=0x2E8A
  -DUSB_PID=0x0A01
  -DUSB_MANUFACTURER="OAT"
  -DUSB_PRODUCT="PT1000 OAT"
  -DDISABLE_USB_SERIAL

lib_deps =
  adafruit/Adafruit MAX31865 library @ ^1.6.2
